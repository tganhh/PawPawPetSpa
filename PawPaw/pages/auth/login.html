<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPaw - Đăng nhập</title>

    <style>
        @import url('../../style.css');
        @import url('../../css/auth.css');
    </style>
</head>

<body
    style="
        background-image: url('../../assets/images/background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    "
>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-content">

                <div class="auth-header">

                    <h1 class="auth-title">
                        Đăng nhập
                    </h1>

                    <img
                        src="../../assets/images/logo.jpg"
                        alt="PawPaw Logo"
                        class="auth-logo"
                    >

                    <img
                        src="../../assets/images/pawpawheader.png"
                        alt="PawPaw"
                        class="auth-brand"
                    >

                </div>


                <form
                    id="login-form"
                    class="auth-form"
                >

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Nhập email"
                        >

                        <p
                            id="email-error"
                            class="form-error"
                        ></p>

                    </div>


                    <div class="form-group">

                        <label for="mat-khau">
                            Mật khẩu
                        </label>

                        <input
                            type="password"
                            id="mat-khau"
                            name="mat-khau"
                            placeholder="Nhập mật khẩu"
                        >

                        <p
                            id="mat-khau-error"
                            class="form-error"
                        ></p>

                    </div>


                    <p
                        id="login-message"
                        class="form-message"
                    ></p>


                    <button
                        type="submit"
                        class="btn btn-primary auth-submit"
                    >
                        Đăng nhập
                    </button>

                </form>


                <div class="auth-footer">

                    <p>
                        Chưa có tài khoản?
                        <a href="register.html">
                            Đăng ký
                        </a>
                    </p>
                    <p>
                        <a href="../../index.html">
                            Về trang chủ
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </main>


    <script src="../../js/util/constants.js"></script>
    <script src="../../js/util/storage.js"></script>
    <script src="../../js/auth/login.js"></script>

</body>

</html>
